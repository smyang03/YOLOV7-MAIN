# yolov7-l6-siav2 (Phase-1)
# = yolov7-w6 구조(ReOrg stem + Conv-s2 다운샘플 + P3~P6) 를 width_multiple 로 경량화한 1280 입력 모델.
# 새 코드 0줄. 기존 IAuxDetect(anchor-based) + ComputeLossAuxOTA(SimOTA) 그대로 사용 → 지금 바로 학습/프로파일 가능.
# width_multiple 을 0.5 / 0.625 / 0.75 로 스윕하며 정확도-지연 knee 를 찾는 것이 Phase-1 실험의 핵심.
# (0.75 ≈ W6 대비 약 0.56배 연산량 근처에서 출발. 정확한 값은 반드시 ONNX/TRT 프로파일로 실측할 것.)

# parameters
nc: 16  # number of classes (siav2 확정)
depth_multiple: 1.0   # 블록 깊이는 유지 (gradient flow 보존)
width_multiple: 0.75  # <-- 0.5 / 0.625 / 0.75 스윕 대상. W6 폭을 L 급으로 축소하는 핵심 노브.

# anchors  (1280 입력 기준 W6 anchor. kmeans 로 siav2 데이터셋에 맞춰 재계산 권장)
anchors:
  - [ 19,27,  44,40,  38,94 ]      # P3/8
  - [ 96,68,  86,152,  180,137 ]   # P4/16
  - [ 140,301,  303,264,  238,542 ] # P5/32
  - [ 436,615,  739,380,  925,792 ] # P6/64

